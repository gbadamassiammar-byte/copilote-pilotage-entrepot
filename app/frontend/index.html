<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilote entrepôt</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M7 14l9-6 9 6v11H7z' fill='white'/%3E%3Crect x='12' y='17' width='8' height='8' fill='%230f766e'/%3E%3C/svg%3E" />
    <script>
      // Applique le thème avant l'affichage de la page (évite un éclair blanc en mode sombre).
      try {
        var t = localStorage.getItem("copilote_theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "sombre" : "clair";
        document.documentElement.dataset.theme = t === "sombre" ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
